# Example PauseNet configuration.
# Replace data_dir and output_dir with your own paths.

data:
  data_dir: data/hek293t_netseq

model:
  input_length: 2114
  output_length: 1000
  channels: 128
  n_dilated_layers: 11
  dropout: 0.10
  profile_kernel_size: 75
  stem_kernel_size: 21
  count_head: procapnet_mean
  use_position_template: false

training:
  output_dir: runs/hek293t_netseq_procapnet_style
  device: cuda:0
  batch_size: 48
  num_workers: 4
  learning_rate: 0.00014
  weight_decay: 0.00001
  max_epochs: 60
  patience: 8
  seed: 20260713
  counts_weight: 100.0
  profile_loss: mnll
  grad_accum_steps: 1
  progress: true
